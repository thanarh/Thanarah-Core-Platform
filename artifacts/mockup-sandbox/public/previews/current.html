    <style>

  <body>
    <header class="thanarah-shell thanarah-shell-header" data-thanarah-shell>

      <div class="thanarah-shell-inner">
        <a class="thanarah-shell-brand" href="#" aria-label="ثنارة | الرئيسية">
          <img src="/__mockup/assets/logo-mark.svg" width="39" height="39" alt="" />
          <span>ثنارة<small>مساحة العميل</small></span>
        </a>
        <nav class="thanarah-shell-nav" aria-label="التنقل الرئيسي">

        <div class="thanarah-shell-actions">

            <span class="thanarah-shell-language-label">العربية</span>
            <span aria-hidden="true">⌄</span>
          </button>
          <span class="thanarah-shell-auth-actions">

            <button class="thanarah-shell-action thanarah-shell-action-primary" type="button">إنشاء حساب</button>
          </span>
          <button class="thanarah-shell-menu" type="button" aria-label="فتح القائمة">
            <span class="thanarah-shell-menu-glyph" aria-hidden="true"><i></i><i></i></span>
          </button>
        </div>
      </div>
    </header>
    <div id="app">
      <main class="loading wrap"><span class="skeleton"></span></main>
    </div>
    <script>
      window.JourneyApi = {
        restoreSession: async () => true,
        me: async () => ({

            version: 3,
            phoneVerification: { status: 'PENDING' },
            profile: {
              legalName: 'عيادات توازن للرعاية',

            status: 'SUBMITTED',
            purpose: 'NEW',
            open: true,
            managerId: null,
            createdAt: '2026-11-10T09:00:00.000Z',
            updatedAt: '2026-11-12T11:30:00.000Z'
          }]

        catalog: async () => ({ registrationOpen: true, packages: [{ code: 'START' }] }),
        logout: async () => true,
        login: async () => true,
        register: async () => true

    <script src="/__mockup/source/customer-app.js"></script>
