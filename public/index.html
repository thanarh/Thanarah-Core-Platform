<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="ثناره — منصة الرعاية الصحية المؤسسية" />
  <title>ثناره · Thanarah</title>

  <!-- Fonts: Tajawal for Arabic elegance, Inter for Latin precision -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400&family=Inter:wght@200;300;400&display=swap" rel="stylesheet" />

  <style>
    /* ─── Reset ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ─── Tokens ─────────────────────────────────────────────── */
    :root {
      --bg:        #F7F6F2;
      --bg2:       #F3F1EC;
      --green:     #1D6B4D;
      --green-mid: #2A8060;
      --green-bar: #1D6B4D;
      --text:      #1A1A1A;
      --text-sub:  rgba(26, 26, 26, 0.45);
      --splash-duration: 5000ms;
    }

    /* ─── Base ───────────────────────────────────────────────── */
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Tajawal', 'Inter', system-ui, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ─── Organic background shapes ─────────────────────────── */
    /*
      Three large, slow-moving blobs. Opacity extremely low so the
      background simply "breathes" without being visible as shapes.
      GPU-accelerated via transform / will-change.
    */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      will-change: transform;
      background: var(--bg2);
    }
    .bg-blob-1 {
      width: 70vmax; height: 70vmax;
      top: -25vmax; left: -20vmax;
      opacity: 0.55;
      animation: blob-drift-1 28s ease-in-out infinite alternate;
    }
    .bg-blob-2 {
      width: 55vmax; height: 55vmax;
      bottom: -20vmax; right: -15vmax;
      opacity: 0.45;
      animation: blob-drift-2 34s ease-in-out infinite alternate;
    }
    .bg-blob-3 {
      width: 40vmax; height: 40vmax;
      top: 50%; left: 50%;
      margin-top: -20vmax; margin-left: -20vmax;
      opacity: 0.30;
      animation: blob-drift-3 22s ease-in-out infinite alternate;
    }

    @keyframes blob-drift-1 {
      from { transform: translate(0, 0)    scale(1);    border-radius: 50%; }
      to   { transform: translate(3%, 2%)  scale(1.04); border-radius: 46% 54% 50% 50%; }
    }
    @keyframes blob-drift-2 {
      from { transform: translate(0, 0)    scale(1);    border-radius: 50%; }
      to   { transform: translate(-2%, -3%) scale(1.05); border-radius: 54% 46% 48% 52%; }
    }
    @keyframes blob-drift-3 {
      from { transform: translate(0, 0)    scale(1);    border-radius: 50%; }
      to   { transform: translate(2%, -2%) scale(1.06); border-radius: 50% 50% 46% 54%; }
    }

    /* ─── Stage / full-screen container ─────────────────────── */
    .stage {
      position: relative;
      z-index: 10;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    /* ─── Logo block ─────────────────────────────────────────── */
    .logo-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(14px, 2.5vh, 22px);

      /* Step 1 & 2: fade-in + scale 96→100 */
      animation: logo-entrance 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both;
    }

    @keyframes logo-entrance {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* Step 3: very subtle breathing — runs after entrance completes */
    .logo-block.breathing {
      animation: logo-entrance 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both,
                 logo-breathe  4.8s  ease-in-out 1.5s infinite;
    }

    @keyframes logo-breathe {
      0%, 100% { transform: scale(1.000); }
      50%       { transform: scale(1.006); }
    }

    /* Step 4: lighting sweep — once, after entrance */
    .logo-mark {
      position: relative;
      overflow: hidden;
      /* isolate stacking for pseudo-element clip */
      isolation: isolate;
    }

    .logo-mark::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        transparent 30%,
        rgba(255, 255, 255, 0.55) 50%,
        transparent 70%
      );
      transform: translateX(-110%);
      animation: light-sweep 1.0s cubic-bezier(0.4, 0, 0.6, 1) 1.6s forwards;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes light-sweep {
      from { transform: translateX(-110%); }
      to   { transform: translateX(110%); }
    }

    /* ─── Arabic wordmark ────────────────────────────────────── */
    .wordmark-ar {
      font-family: 'Tajawal', sans-serif;
      font-weight: 200;
      font-size: clamp(3.6rem, 10vw, 6.8rem);
      line-height: 1;
      letter-spacing: 0.02em;
      color: var(--text);
      direction: rtl;
      user-select: none;
    }

    /* ─── Latin name below ───────────────────────────────────── */
    .wordmark-en {
      font-family: 'Inter', 'Tajawal', sans-serif;
      font-weight: 200;
      font-size: clamp(0.55rem, 1.5vw, 0.75rem);
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--text-sub);
      direction: ltr;
      user-select: none;
      margin-top: -4px;
    }

    /* ─── Green accent rule ──────────────────────────────────── */
    .accent-rule {
      width: clamp(32px, 5vw, 48px);
      height: 1px;
      background: var(--green);
      opacity: 0.6;
      border-radius: 1px;
      margin-top: 4px;
    }

    /* ─── Rotating tagline ───────────────────────────────────── */
    .tagline-wrap {
      position: relative;
      height: clamp(22px, 3.5vh, 30px);
      width: clamp(260px, 60vw, 500px);
      overflow: hidden;
      margin-top: clamp(24px, 4vh, 36px);

      /* Appear after logo */
      opacity: 0;
      animation: tagline-appear 0.7s ease 1.3s forwards;
    }

    @keyframes tagline-appear {
      to { opacity: 1; }
    }

    .tagline-item {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;

      font-family: 'Tajawal', sans-serif;
      font-weight: 300;
      font-size: clamp(0.78rem, 1.8vw, 0.95rem);
      letter-spacing: 0.05em;
      color: var(--text-sub);
      text-align: center;
      white-space: nowrap;
      direction: rtl;

      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .tagline-item.active {
      opacity: 1;
    }

    .tagline-item[lang="en"] {
      font-family: 'Inter', 'Tajawal', sans-serif;
      font-weight: 300;
      letter-spacing: 0.08em;
      direction: ltr;
    }

    /* ─── Progress bar ───────────────────────────────────────── */
    .progress-track {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: transparent;
      z-index: 20;

      opacity: 0;
      animation: progress-appear 0.4s ease 0.8s forwards;
    }

    @keyframes progress-appear {
      to { opacity: 1; }
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--green-bar);
      border-radius: 0 1px 1px 0;

      animation: progress-fill var(--splash-duration) cubic-bezier(0.4, 0, 0.2, 1) 0.8s forwards;
    }

    @keyframes progress-fill {
      from { width: 0%; }
      to   { width: 100%; }
    }

    /* ─── Full-page fade-out overlay ─────────────────────────── */
    .fade-out-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.65s cubic-bezier(0.4, 0, 1, 1);
    }
    .fade-out-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    /* ─── Reduced-motion overrides ───────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .bg-blob,
      .logo-mark::after { animation: none; }

      .logo-block {
        animation: logo-entrance 0.01s linear 0s both;
      }
      .logo-block.breathing {
        animation: none;
        opacity: 1;
        transform: scale(1);
      }
      .progress-bar {
        animation: progress-fill var(--splash-duration) linear 0s forwards;
      }
    }
  </style>
</head>

<body>
  <!-- Organic background -->
  <div class="bg-blob bg-blob-1" aria-hidden="true"></div>
  <div class="bg-blob bg-blob-2" aria-hidden="true"></div>
  <div class="bg-blob bg-blob-3" aria-hidden="true"></div>

  <!-- Main stage -->
  <main
    class="stage"
    role="main"
    aria-label="شاشة ترحيب ثناره — Thanarah splash screen"
  >
    <!-- Logo block -->
    <div class="logo-block" id="logoBlock">
      <div class="logo-mark">
        <div class="wordmark-ar" aria-label="ثناره">ثناره</div>
      </div>
      <div class="wordmark-en" aria-hidden="true">THANARAH</div>
      <div class="accent-rule" aria-hidden="true"></div>
    </div>

    <!-- Rotating taglines -->
    <div
      class="tagline-wrap"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      id="taglineWrap"
    >
      <!-- Arabic lines -->
      <span class="tagline-item active" lang="ar">المستقبل الطبي يبدأ من هنا</span>
      <span class="tagline-item" lang="ar">ثناره… حيث تعمل التقنية لخدمة الرعاية الصحية</span>
      <span class="tagline-item" lang="ar">منصة واحدة لإدارة منشأتك بثقة</span>
      <span class="tagline-item" lang="ar">نبني التقنية… لتبقى الرعاية أولاً</span>
      <!-- English lines -->
      <span class="tagline-item" lang="en">The Future of Healthcare Starts Here</span>
      <span class="tagline-item" lang="en">Technology Designed Around Care</span>
      <span class="tagline-item" lang="en">One Platform. Infinite Possibilities.</span>
      <span class="tagline-item" lang="en">Building the Future of Healthcare.</span>
    </div>
  </main>

  <!-- Progress bar -->
  <div class="progress-track" aria-hidden="true">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <!-- Fade-out overlay -->
  <div class="fade-out-overlay" id="fadeOverlay" aria-hidden="true"></div>

  <script>
    'use strict';

    // ── Breathing animation: attach class once entrance is done ──
    (function attachBreathing() {
      const block = document.getElementById('logoBlock');
      // entrance: 0.9s duration + 0.4s delay = 1.3s
      setTimeout(function () {
        block.classList.add('breathing');
      }, 1350);
    })();

    // ── Tagline rotation ─────────────────────────────────────────
    (function rotateTags() {
      const items = Array.from(
        document.getElementById('taglineWrap').querySelectorAll('.tagline-item')
      );
      let current = 0;

      // Start rotating after the tagline appears (~1.3s)
      setTimeout(function rotate() {
        const next = (current + 1) % items.length;
        items[current].classList.remove('active');
        items[next].classList.add('active');
        current = next;
        setTimeout(rotate, 2000);
      }, 2000);
    })();

    // ── Splash completion: fade out → redirect ───────────────────
    (function completeSplash() {
      const SPLASH_MS    = 5000;
      const FADE_DELAY   = 300;   // small buffer after bar completes
      const REDIRECT_URL = '/login';

      const overlay = document.getElementById('fadeOverlay');

      setTimeout(function () {
        overlay.classList.add('active');
        // After fade transition (0.65s) redirect
        setTimeout(function () {
          window.location.href = REDIRECT_URL;
        }, 700);
      }, SPLASH_MS + FADE_DELAY);
    })();
  </script>
</body>
</html>
