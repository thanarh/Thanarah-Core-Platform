<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="ثناره — منصة رقمية متكاملة لإدارة المنشآت الصحية" />
  <title>ثناره · Thanarah</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500&family=Inter:wght@200;300&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Tokens ─────────────────────────────────────────────── */
    :root {
      --bg:         #F7F6F2;
      --green-dark: #1C5C3C;
      --green-sage: #87AC96;
      --text:       #1A1A1A;
      --text-sub:   rgba(26,26,26,0.55);
      --text-muted: rgba(26,26,26,0.32);
    }

    /* ── Base ───────────────────────────────────────────────── */
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Tajawal', system-ui, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Background: ghosted mark ────────────────────────────
       Very subtle — the cross shape is barely perceptible,
       anchored to the bottom-right corner so it doesn't compete
       with the centered logo.
    ────────────────────────────────────────────────────────── */
    .bg-mark {
      position: fixed;
      bottom: -12%;
      right: -8%;
      width: min(55vw, 55vh);
      height: auto;
      z-index: 0;
      pointer-events: none;
      opacity: 0.038;
      animation: mark-drift 50s ease-in-out infinite alternate;
      will-change: transform;
    }
    .bg-mark svg { width: 100%; height: auto; display: block; }

    @keyframes mark-drift {
      from { transform: translate(0, 0)    scale(1.00); }
      to   { transform: translate(-2%, -2%) scale(1.03); }
    }

    /* ── Page ───────────────────────────────────────────────── */
    .page {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* bottom padding reserves space for the fixed footer */
      padding: clamp(24px,6vh,80px) clamp(24px,8vw,100px) clamp(72px,12vh,110px);
      gap: 0;
    }

    /* ── Logo lockup ─────────────────────────────────────────
       Force LTR layout so the cross mark is always on the left
       and the Arabic wordmark is on the right — matching the
       official horizontal logo orientation.
    ────────────────────────────────────────────────────────── */
    .logo-lockup {
      display: flex;
      direction: ltr;          /* logo reads L→R regardless of page RTL */
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 2.5vw, 28px);

      animation: logo-in 1.0s cubic-bezier(0.22,1,0.36,1) 0.3s both;
    }
    .logo-lockup.breathing {
      animation:
        logo-in     1.0s cubic-bezier(0.22,1,0.36,1) 0.3s both,
        logo-breath 5.2s ease-in-out 1.5s infinite;
    }
    @keyframes logo-in {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1.00); }
    }
    @keyframes logo-breath {
      0%,100% { transform: scale(1.000); }
      50%      { transform: scale(1.007); }
    }

    /* SVG cross mark */
    .logo-mark-svg {
      flex-shrink: 0;
      width: clamp(64px, 11vw, 110px);
      height: auto;
    }
    .logo-mark-svg svg { width: 100%; height: auto; display: block; }

    /* Arabic + Latin wordmark */
    .logo-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }
    .logo-arabic {
      font-family: 'Tajawal', sans-serif;
      font-weight: 500;
      font-size: clamp(2.6rem, 7vw, 5.4rem);
      line-height: 1;
      letter-spacing: 0.01em;
      color: var(--green-dark);
      direction: rtl;
      white-space: nowrap;
    }
    .logo-latin {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: clamp(0.52rem, 1.1vw, 0.82rem);
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--green-dark);
      opacity: 0.55;
      direction: ltr;
      padding-left: 0.42em;  /* compensate trailing letter-spacing */
      white-space: nowrap;
    }

    /* ── Rule ───────────────────────────────────────────────── */
    .rule {
      width: clamp(28px, 3.5vw, 42px);
      height: 1px;
      background: var(--green-dark);
      border-radius: 1px;
      margin: clamp(26px, 4.5vh, 44px) 0 clamp(22px, 4vh, 38px);
      opacity: 0;
      animation: fade-up 0.6s ease 1.05s forwards;
    }

    /* ── Content ────────────────────────────────────────────── */
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(8px, 1.6vh, 14px);
      text-align: center;
      max-width: min(520px, 90vw);
    }

    .headline {
      font-family: 'Tajawal', sans-serif;
      font-weight: 200;
      font-size: clamp(1.15rem, 3vw, 1.75rem);
      letter-spacing: 0.04em;
      color: var(--text);
      opacity: 0;
      animation: fade-up 0.7s ease 1.15s forwards;
    }

    .description {
      font-family: 'Tajawal', sans-serif;
      font-weight: 300;
      font-size: clamp(0.76rem, 1.5vw, 0.92rem);
      line-height: 1.95;
      color: var(--text-sub);
      letter-spacing: 0.02em;
      max-width: min(420px, 86vw);
      opacity: 0;
      animation: fade-up 0.7s ease 1.28s forwards;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: clamp(4px, 0.8vh, 8px);
      padding: 7px 22px;
      border: 1px solid rgba(28,92,60,0.16);
      border-radius: 100px;
      background: rgba(28,92,60,0.038);
      font-family: 'Tajawal', sans-serif;
      font-weight: 300;
      font-size: clamp(0.73rem, 1.4vw, 0.84rem);
      color: var(--green-dark);
      letter-spacing: 0.07em;
      user-select: none;
      opacity: 0;
      animation: fade-up 0.7s ease 1.42s forwards;
    }

    /* ── Footer ─────────────────────────────────────────────── */
    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      padding: 14px 24px max(18px, env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(247,246,242,1) 60%, transparent);
    }
    footer p {
      font-family: 'Inter', sans-serif;
      font-weight: 200;
      font-size: clamp(0.56rem, 1vw, 0.64rem);
      letter-spacing: 0.14em;
      color: var(--text-muted);
      direction: ltr;
      text-align: center;
      opacity: 0;
      animation: fade-up 0.6s ease 1.65s forwards;
    }

    /* ── Keyframes ──────────────────────────────────────────── */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Reduced motion ─────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .bg-mark { animation: none; }
      .logo-lockup,
      .logo-lockup.breathing { animation: none; opacity: 1; transform: none; }
      .rule, .headline, .description, .badge, footer p {
        animation: none; opacity: 1; transform: none;
      }
    }
  </style>
</head>
<body>

  <!-- Background mark (bottom-right, very faint) -->
  <div class="bg-mark" aria-hidden="true">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect x="37" y="50" width="26" height="38" rx="13" fill="#1C5C3C"/>
      <rect x="50" y="37" width="38" height="26" rx="13" fill="#1C5C3C"/>
      <rect x="37" y="12" width="26" height="38" rx="13" fill="#1C5C3C"/>
      <rect x="12" y="37" width="38" height="26" rx="13" fill="#1C5C3C"/>
    </svg>
  </div>

  <main class="page">

    <!-- Logo lockup -->
    <div class="logo-lockup" id="logoLockup" role="img" aria-label="شعار ثناره — Thanarah">

      <!-- Cross mark -->
      <div class="logo-mark-svg">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- Sage arms (behind) -->
          <rect x="37" y="50" width="26" height="38" rx="13" fill="#87AC96"/>
          <rect x="50" y="37" width="38" height="26" rx="13" fill="#87AC96"/>
          <!-- Dark arms (front) -->
          <rect x="37" y="12" width="26" height="38" rx="13" fill="#1C5C3C"/>
          <rect x="12" y="37" width="38" height="26" rx="13" fill="#1C5C3C"/>
        </svg>
      </div>

      <!-- Wordmark -->
      <div class="logo-text">
        <span class="logo-arabic">ثناره</span>
        <span class="logo-latin">THANARAH</span>
      </div>

    </div>

    <!-- Separator rule -->
    <div class="rule" aria-hidden="true"></div>

    <!-- Text content -->
    <div class="content">
      <h1 class="headline">المستقبل الطبي يبدأ من هنا</h1>
      <p class="description">
        منصة رقمية متكاملة لإدارة المنشآت الصحية،
        يجري العمل عليها بعناية لتقديم تجربة استثنائية.
      </p>
      <div class="badge" role="status" aria-label="قريبًا">🚀&nbsp; قريبًا</div>
    </div>

  </main>

  <footer>
    <p>© 2026 Thanarah Team</p>
    <p>All Rights Reserved.</p>
  </footer>

  <script>
    'use strict';
    setTimeout(function () {
      var el = document.getElementById('logoLockup');
      if (el) el.classList.add('breathing');
    }, 1450);
  </script>

</body>
</html>
