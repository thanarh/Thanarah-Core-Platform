<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f3ec">
  <meta name="description" content="مساحة ثناره لإدارة المواعيد والعمليات السريرية">
  <title>المواعيد · ثناره</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/appointments/styles.css">
  <link rel="stylesheet" href="/assets/thanarah-web-experience.css">
  <script src="/assets/thanarah-translations.js" defer></script>
  <script src="/communications/translations.js" defer></script>
  <script src="/assets/thanarah-i18n.js" defer></script>
  <script src="/appointments/api.js" defer></script>
  <script src="/appointments/timezone.js" defer></script>
  <script src="/appointments/service-availability.js" defer></script>
  <script src="/appointments/app.js" defer></script>
</head>
<body>
  <main id="app" aria-live="polite">
    <section class="workspace-screen" aria-label="تحميل مساحة المواعيد">
      <div class="workspace-card">
        <div class="auth-brand">
          <img src="/assets/logo-transparent.png" alt="">
          <div><strong>ثناره</strong><span>THANARAH · WORKSPACE</span></div>
        </div>
        <div class="loading-state" style="margin:0">
          <div class="skeleton-row" aria-hidden="true"></div>
          <p class="form-note">جارٍ التحقق من جلسة الدخول…</p>
        </div>
      </div>
    </section>
  </main>
  <div id="modal-root"></div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
