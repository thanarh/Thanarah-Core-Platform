services:
  - type: web
    name: thanarah-backend
    runtime: node
    buildCommand: npm install --include=dev && npx nest build
    startCommand: node dist/main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false   # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false   # set manually in Render dashboard
      - key: SESSION_SECRET
        sync: false   # set manually in Render dashboard
